<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Estratégica y Evaluación del Desempeño por Competencias (360°/180°) • Metodología Martha Alles</title>
  
  <!-- SEO & Metadatos Pedagógicos -->
  <meta name="description" content="Curso interactivo SCORM 1.2 / 2004 basado en 'Desempeño por competencias: Evaluación de 360°' y 'Dirección estratégica de Recursos Humanos. Gestión por competencias: Casos' de Martha Alles.">
  <meta name="author" content="Equipo de Talento &amp; Metodología Martha Alles">

  <!-- Hojas de Estilo Mint Design System & Rise Blocks -->
  <link rel="stylesheet" href="css/mint-theme.css?v=360_20261003c">
  <link rel="stylesheet" href="css/rise-blocks.css?v=360_20261003c">
</head>
<body class="mint-theme">
  <!-- Contenedor Principal de la SPA -->
  <div id="app" aria-label="Curso Interactivo de Evaluación del Desempeño por Competencias 360°">
    <!-- El router montará aquí la interfaz dinámica -->
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; font-family: sans-serif; color: #0F766E;">
      <p>Cargando Entorno de Aprendizaje Interactivo...</p>
    </div>
  </div>

  <!-- Inicialización del Core Engine y SPA Router -->
  <script type="module">
    import { ScormAdapter } from './js/core/scorm-adapter.js?v=360_20261003c';
    import { CourseStore } from './js/core/store.js?v=360_20261003c';
    import { CourseRouter } from './js/ui/router.js?v=360_20261003c';

    // 1. Inicializa el Adaptador SCORM (con fallback automático a localStorage)
    const scormAdapter = new ScormAdapter();
    scormAdapter.init();

    // 2. Inicializa el CourseStore reactivo sincronizado con el LMS
    const store = new CourseStore(scormAdapter);

    // 3. Monta el SPA Router
    const router = new CourseRouter({
      store,
      adapter: scormAdapter,
      rootContainer: '#app'
    });

    // 4. Asegura la persistencia y cierre limpio con exit='suspend' ante descarga de la ventana (idempotente)
    let unloadHandled = false;
    const handleUnload = () => {
      if (unloadHandled) return;
      unloadHandled = true;
      try {
        scormAdapter.setExit('suspend');
        scormAdapter.finish();
      } catch (e) {
        // En navegadores estrictos no interrumpe el cierre
      }
    };
    window.addEventListener('beforeunload', handleUnload);
    window.addEventListener('pagehide', handleUnload);

    // Exposición global para depuración en consola de LMS
    window.CourseApp = {
      adapter: scormAdapter,
      store,
      router
    };
  </script>
</body>
</html>
